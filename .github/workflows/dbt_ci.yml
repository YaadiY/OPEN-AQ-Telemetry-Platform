name: OpenAQ dbt CI Pipeline

# Trigger on Pull Requests to the main branch
on:
  pull_request:
    branches:
      - main
    paths:
      - 'dbt/**'               # Only run when files inside the dbt/ directory are modified

jobs:
  dbt_data_quality_tests:
    name: Run dbt Compilation & Quality Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Step 3: Install dbt and BigQuery adapter
      - name: Install dbt-bigquery
        run: |
          pip install --upgrade pip
          pip install dbt-bigquery

      # Step 4: Authenticate to Google Cloud via Workload Identity Federation (Keyless)
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/165723068338/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'openaq-data-engineer@project-acf803b4-e926-4de8-aa7.iam.gserviceaccount.com'

      # Step 5: Install dbt packages and compile SQL
      - name: dbt Deps & Compile
        env:
          GCP_PROJECT_ID: project-acf803b4-e926-4de8-aa7
        run: |
          cd dbt
          dbt deps
          dbt compile --profiles-dir . --target dev

      # Step 6: Execute Data Quality Tests (Uniqueness, Not-Null, Referential Integrity)
      - name: Run dbt Data Quality Tests
        env:
          GCP_PROJECT_ID: project-acf803b4-e926-4de8-aa7
        run: |
          cd dbt
          dbt test --profiles-dir . --target dev

