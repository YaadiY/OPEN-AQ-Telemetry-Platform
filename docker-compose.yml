services:
  # =========================================================================
  # 1. KESTRA ORCHESTRATOR (Slim, Embedded H2, Web UI on port 8080)
  # =========================================================================
  kestra:
    image: kestra/kestra:latest-slim
    container_name: openaq_kestra
    user: "root"
    command: server local
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./orchestration/flows:/app/flows
      - ./data:/app/data
      - kestra_data:/app/storage

  # =========================================================================
  # 2. OPENAQ PIPELINE RUNNER (Ingestion + dbt BigQuery Engine)
  # =========================================================================
  openaq-pipeline:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    image: openaq-pipeline:latest
    container_name: openaq_pipeline_runner
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
    volumes:
      - ./data:/app/data
      - ${APPDATA}/gcloud/application_default_credentials.json:/root/.config/gcloud/application_default_credentials.json:ro

volumes:
  kestra_data:
