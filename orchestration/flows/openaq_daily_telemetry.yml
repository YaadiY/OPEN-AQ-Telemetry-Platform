id: openaq_daily_telemetry
namespace: openaq
description: "Autonomous daily telemetry pipeline: Ingestion -> GCS Bronze Lake -> dbt BigQuery Models -> Automated Testing"

variables:
  # In production, values are passed via .env or Kestra Secrets
  openaq_api_key: "{{ env('OPENAQ_API_KEY', 'your_openaq_api_key_here') }}"
  gcp_project_id: "{{ env('GCP_PROJECT_ID', 'your_gcp_project_id_here') }}"
  gcs_bucket_name: "{{ env('GCS_BUCKET_NAME', 'your_gcs_bucket_name_here') }}"

tasks:
  # =========================================================================
  # TASK 1: Daily Ingestion from OpenAQ API to GCS Bronze Data Lake
  # =========================================================================
  - id: ingest_telemetry
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: openaq-pipeline:latest
    env:
      OPENAQ_API_KEY: "{{ vars.openaq_api_key }}"
      GCP_PROJECT_ID: "{{ vars.gcp_project_id }}"
      GCS_BUCKET_NAME: "{{ vars.gcs_bucket_name }}"
    commands:
      - cd /app && python ingestion/fetch_daily.py

  # =========================================================================
  # TASK 2: Transform Data Marts in BigQuery via dbt
  # =========================================================================
  - id: dbt_transform
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: openaq-pipeline:latest
    env:
      GCP_PROJECT_ID: "{{ vars.gcp_project_id }}"
      GCS_BUCKET_NAME: "{{ vars.gcs_bucket_name }}"
    commands:
      - cd /app/dbt && dbt run --profiles-dir .

  # =========================================================================
  # TASK 3: Automated Data Quality Tests in dbt
  # =========================================================================
  - id: dbt_data_quality_tests
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: openaq-pipeline:latest
    env:
      GCP_PROJECT_ID: "{{ vars.gcp_project_id }}"
      GCS_BUCKET_NAME: "{{ vars.gcs_bucket_name }}"
    commands:
      - cd /app/dbt && dbt test --profiles-dir .

# =========================================================================
# AUTOMATED SCHEDULE: Runs daily at 02:00 UTC
# =========================================================================
triggers:
  - id: daily_cron_trigger
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"
